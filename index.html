<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You Gotta Know – Quiz</title>

  <!-- MathJax -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ede9fe;
      margin: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      margin: 6px;
      padding: 12px 20px;
      font-size: 1.05em;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid black;
      cursor: pointer;
      background: white;
    }

    .quiz {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      border: 3px solid black;
      padding: 22px;
      border-radius: 12px;
      font-size: 1.35em;
      font-weight: 600;
      text-align: center;
    }

    .answer {
      background: #f3f4f6;
      display: none;
    }

    .show-answers .answer {
      display: block;
    }

    /* Strong colors */
    .unit0 { background: #ef4444; color: white; }
    .unit1 { background: #2563eb; color: white; }
    .unit4 { background: #facc15; }
    .unit5 { background: #22c55e; color: white; }
    .unit6 { background: #fb923c; }

  
  </style>
</head>

<body>

<h1>You Gotta Know – Quiz</h1>

<div class="controls">
  <button onclick="generateQuiz()">Generate Quiz</button>
  <button onclick="toggleAnswers()">Reveal Answers</button>
</div>

<div class="quiz" id="quiz"></div>

<script>
/* ---------- FLASHCARDS (Q + A) ---------- */

const unit0 = [
  { q: "\\(\\sin(0)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\cos(0)=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(\\sin(\\pi)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\tan(0)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\cos(\\pi)=\\ ?\\)", a: "\\(-1\\)" },
  { q: "\\(\\sin(\\pi/2)=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(\\cos(\\pi/2)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(e^0=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(e^1=\\ ?\\)", a: "\\(e\\)" },
  { q: "\\(\\ln(1)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\ln(e)=\\ ?\\)", a: "\\(1\\)" },
  
  { q: "Factor \\(x^2-16\\)", a: "\\(x-4)(x+4)\\" },
  { q: "Factor \\(x^2+2x-8\\)", a: "\\(x+4)(x-2)\\)" },
  { q: "Factor \\(x^2-6x\\)", a: "\\x(x-6)\\" },
  { q: "Area of a Triangle", a: "\\(A=\\frac12(bh)\\)" },
  { q: "Area of a Rectangle", a: "\\A=bh\\" },
  { q: "Area of a Semi-Circle", a: "\\(A=\\frac12(\\pi r^2) \\)" },
  { q: "Area of a Quarter-Circle", a: "\\(A=\\frac14(\\pi r^2) \\)" },
  { q: "Area of a Trapezoid", a: "\\(A=\\frac12(b_1+b_2)h\\)" }

];

const unit1to3 = [
  {
    q: "When does \\(\\lim_{x\\to c} f(x)\\) exist?",
    a: "Left and right limits exist and are equal"
  },
  {
    q: "Definition of continuity at \\(x=c\\)",
    a: "\\(f(c)\\) exists, limit exists, and equals \\(f(c)\\)"
  },
  {
    q: "Power Rule",
    a: "\\(\\frac{d}{dx}(x^n)=nx^{n-1}\\)"
  },
  {
    q: "Chain Rule",
    a: "\\(f'(g(x))g'(x)\\)"
  }
];

const unit4 = [
  {
    q: "When is speed increasing?",
    a: "Velocity and acceleration have the same sign"
  },
  {
    q: "Equation of a tangent line at \\(x=a\\)",
    a: "\\(y-f(a)=f'(a)(x-a)\\)"
  },
  {
    q: "State L’Hôpital’s Rule",
    a: "If indeterminate \\(0/0\\), take derivatives of top and bottom"
  }
];

const unit5 = [
  {
    q: "Define a critical point",
    a: "\\(f'(x)=0\\) or undefined"
  },
  {
    q: "Condition for concave up",
    a: "\\(f''>0\\)"
  },
  {
    q: "What defines an inflection point?",
    a: "\\(f''\\) changes sign"
  }
];

const unit6 = [
  {
    q: "FTC Part 1",
    a: "\\(\\frac{d}{dx}\\int_a^x f(t)dt = f(x)\\)"
  },
  {
    q: "FTC Part 2",
    a: "\\(\\int_a^b f'(x)dx=f(b)-f(a)\\)"
  },
  {
    q: "\\(\\int x^n dx\\)",
    a: "\\(\\frac{x^{n+1}}{n+1}+C\\)"
  }
];

/* ---------- UTILITIES ---------- */

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateQuiz() {
  const quiz = document.getElementById("quiz");
  quiz.classList.remove("show-answers");
  quiz.innerHTML = "";

  const selections = [
    { ...randomFrom(unit0), cls: "unit0", label: "Unit 0" },
    { ...randomFrom(unit1to3), cls: "unit1", label: "Units 1–3" },
    { ...randomFrom(unit4), cls: "unit4", label: "Unit 4" },
    { ...randomFrom(unit5), cls: "unit5", label: "Unit 5" },
    { ...randomFrom(unit6), cls: "unit6", label: "Unit 6" }
  ];

  selections.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
      <div class="card ${item.cls}">
        <strong>Problem ${i + 1} (${item.label})</strong><br><br>
        ${item.q}
      </div>
      <div class="card answer">
        <strong>Answer</strong><br><br>
        ${item.a}
      </div>
    `;

    quiz.appendChild(row);
  });

  MathJax.typeset();
}

function toggleAnswers() {
  document.getElementById("quiz").classList.toggle("show-answers");
}


</script>

</body>
</html>
