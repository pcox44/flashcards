<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You Gotta Know – Quiz</title>

  <!-- MathJax -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ede9fe;
      margin: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      margin: 6px;
      padding: 12px 20px;
      font-size: 1.05em;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid black;
      cursor: pointer;
      background: white;
    }

    .quiz {
      max-width: 1200px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      border: 3px solid black;
      padding: 22px;
      border-radius: 12px;
      font-size: 1.35em;
      font-weight: 600;
      text-align: center;
    }

    .answer {
      background: #f3f4f6;
      display: none;
    }

    .show-answers .answer {
      display: block;
    }

    /* Strong colors */
    .unit0 { background: #ef4444; color: white; }
    .unit1 { background: #2563eb; color: white; }
    .unit4 { background: #facc15; }
    .unit5 { background: #22c55e; color: white; }
    .unit6 { background: #fb923c; }

  
  </style>
</head>

<body>

<h1>You Gotta Know – Quiz</h1>

<div class="controls">
  <button onclick="generateQuiz()">Generate Quiz</button>
  <button onclick="toggleAnswers()">Reveal Answers</button>
</div>

<div class="quiz" id="quiz"></div>

<script>
/* ---------- FLASHCARDS (Q + A) ---------- */

const unit0 = [
  { q: "\\(\\sin(0)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\cos(0)=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(\\sin(\\pi)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\tan(0)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\cos(\\pi)=\\ ?\\)", a: "\\(-1\\)" },
  { q: "\\(\\sin(\\pi/2)=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(\\cos(\\pi/2)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(e^0=\\ ?\\)", a: "\\(1\\)" },
  { q: "\\(e^1=\\ ?\\)", a: "\\(e\\)" },
  { q: "\\(\\ln(1)=\\ ?\\)", a: "\\(0\\)" },
  { q: "\\(\\ln(e)=\\ ?\\)", a: "\\(1\\)" },
  
  { q: "Factor \\(x^2-16\\)", a: "\\((x-4)(x+4)\\)" },
  { q: "Factor \\(x^2+2x-8\\)", a: "(\\((x+4)(x-2)\\)" },
  { q: "Factor \\(x^2-6x\\)", a: "\\(x(x-6)\\)" },
  { q: "Area of a Triangle", a: "\\(A=\\frac12(bh)\\)" },
  { q: "Area of a Rectangle", a: "\\(A=bh\\)" },
  { q: "Area of a Semi-Circle", a: "\\(A=\\frac12(\\pi r^2) \\)" },
  { q: "Area of a Quarter-Circle", a: "\\(A=\\frac14(\\pi r^2) \\)" },
  { q: "Area of a Trapezoid", a: "\\(A=\\frac12(b_1+b_2)h\\)" }

];

const unit1to3 = [
  {
    q: "When does \\(\\lim_{x\\to c} f(x)\\) exist?",
    a: "If \\(\\lim_{x\\to c^-} f(x)=\\lim_{x\\to c^+} f(x)\\)"
  },
  {
    q: "When is \\(f(x)\\) continuous at \\(x=c\\)?",
    a: "\\(f(c)\\) exists, \\(\\lim_{x\\to c} f(x)\\) exists, and \\(f(c)=\\lim_{x\\to c^-} f(x)=\\lim_{x\\to c^+} f(x)\\)"
  },
  {
    q: "Types of discontinuities",
    a: "Removable (hole) and non-removable (jump or vertical asymptote)"
  },
  {
    q: "What does a vertical asymptote at \\(x=c\\) imply?",
    a: "\\(\\lim_{x\\to c} f(x)\\) does not exist"
  },
  {
    q: "What does a horizontal asymptote at \\(y=c\\) imply?",
    a: "\\(\\lim_{x\\to \\pm\\infty} f(x)=c\\)"
  },
  {
    q: "Intermediate Value Theorem (IVT)",
    a: "If \\(f(x)\\) is continuous on \\([a,b]\\), then all values between \\(f(a)\\) and \\(f(b)\\) occur on \\([a,b]\\)"
  },
  {
    q: "When is \\(f\\) differentiable at \\(x=c\\)?",
    a: "\\(f\\) is continuous and \\(\\lim_{x\\to c^-} f'(x)=\\lim_{x\\to c^+} f'(x)\\)"
  },
  {
    q: "Average rate of change on \\([a,b]\\)",
    a: "\\(\\frac{f(b)-f(a)}{b-a}\\)"
  },
  {
    q: "Definition of the derivative",
    a: "\\(f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}\\)"
  },
  {
    q: "When does \\(f'(a)\\) not exist?",
    a: "If \\(f\\) is discontinuous or has a cusp, corner, or vertical tangent at \\(x=a\\)"
  },
  {
    q: "Power Rule",
    a: "\\(\\frac{d}{dx}(x^n)=nx^{n-1}\\)"
  },
  {
    q: "Derivative of \\(\\sin x\\)",
    a: "\\(\\frac{d}{dx}(\\sin x)=\\cos x\\)"
  },
  {
    q: "Derivative of \\(\\cos x\\)",
    a: "\\(\\frac{d}{dx}(\\cos x)=-\\sin x\\)"
  },
  {
    q: "Derivative of \\(e^x\\)",
    a: "\\(\\frac{d}{dx}(e^x)=e^x\\)"
  },
  {
    q: "Derivative of \\(\\ln x\\)",
    a: "\\(\\frac{d}{dx}(\\ln x)=\\frac{1}{x}\\)"
  },
  {
    q: "Product Rule",
    a: "\\(\\frac{d}{dx}[f(x)g(x)]=f'(x)g(x)+f(x)g'(x)\\)"
  },
  {
    q: "Quotient Rule",
    a: "\\(\\frac{d}{dx}\\left(\\frac{f(x)}{g(x)}\\right)=\\frac{g(x)f'(x)-f(x)g'(x)}{(g(x))^2}\\)"
  },
  {
    q: "Chain Rule",
    a: "\\(\\frac{d}{dx}[f(g(x))]=f'(g(x))g'(x)\\)"
  },
  {
    q: "Implicit differentiation example",
    a: "\\(\\frac{d}{dx}(y^2)=2y\\frac{dy}{dx}\\)"
  }
];


const unit4 = [
  {
    q: "Units of \\(f'(t)\\)",
    a: "Units of \\(f\\) divided by units of \\(t\\)"
  },
  {
    q: "Velocity",
    a: "\\(v(t)=x'(t)\\)"
  },
  {
    q: "Acceleration",
    a: "\\(a(t)=v'(t)=x''(t)\\)"
  },
  {
    q: "When is a particle at rest?",
    a: "\\(v(t)=0\\)"
  },
  {
    q: "When is speed increasing?",
    a: "\\(v(t)\\) and \\(a(t)\\) have the same sign"
  },
  {
    q: "When is speed decreasing?",
    a: "\\(v(t)\\) and \\(a(t)\\) have opposite signs"
  },
  {
    q: "When does a particle change direction?",
    a: "\\(v(t)\\) changes sign"
  },
  {
    q: "Equation of the tangent line at \\(x=a\\)",
    a: "\\(y-f(a)=f'(a)(x-a)\\)"
  },
  {
    q: "When does the tangent line overestimate near \\(x=c\\)?",
    a: "If \\(f\\) is concave down"
  },
  {
    q: "When does the tangent line underestimate near \\(x=c\\)?",
    a: "If \\(f\\) is concave up"
  },
  {
    q: "L’Hospital’s Rule (\\(0/0\\) form)",
    a: "If \\(\\lim_{x\\to c} f(x)=0\\) and \\(\\lim_{x\\to c} g(x)=0\\), then \\(\\lim_{x\\to c}\\frac{f(x)}{g(x)}=\\lim_{x\\to c}\\frac{f'(x)}{g'(x)}\\)"
  }
];


const unit5 = [
  {
    q: "What is a critical point (or critical value)?",
    a: "\\(f'(x)=0\\) or \\(f'(x)\\) is undefined"
  },
  {
    q: "When does a function have a horizontal tangent?",
    a: "\\(\\frac{dy}{dx}=0\\)"
  },
  {
    q: "When does a function have a vertical tangent?",
    a: "\\(\\frac{dy}{dx}\\) is undefined"
  },
  {
    q: "How do you find absolute extrema of \\(f\\) on \\([a,b]\\)?",
    a: "Evaluate \\(f\\) at endpoints and at all critical points"
  },
  {
    q: "Mean Value Theorem (MVT)",
    a: "If \\(f\\) is continuous on \\([a,b]\\) and differentiable on \\((a,b)\\), then \\(f'(c)=\\frac{f(b)-f(a)}{b-a}\\) for some \\(c\\in(a,b)\\)"
  },
  {
    q: "Extreme Value Theorem (EVT)",
    a: "A continuous function on \\([a,b]\\) has an absolute maximum and minimum"
  },
  {
    q: "What does it mean if \\(f\\) is increasing?",
    a: "\\(f'(x)>0\\)"
  },
  {
    q: "What does it mean if \\(f\\) is decreasing?",
    a: "\\(f'(x)<0\\)"
  },
  {
    q: "When does \\(f\\) have a relative maximum?",
    a: "\\(f'\\) changes from positive to negative"
  },
  {
    q: "When does \\(f\\) have a relative minimum?",
    a: "\\(f'\\) changes from negative to positive"
  },
  {
    q: "When is \\(f\\) concave up?",
    a: "\\(f'\\) is increasing or \\(f''(x)>0\\)"
  },
  {
    q: "When is \\(f\\) concave down?",
    a: "\\(f'\\) is decreasing or \\(f''(x)<0\\)"
  },
  {
    q: "When does \\(f\\) have an inflection point?",
    a: "\\(f'\\) has a relative extremum or \\(f''\\) changes sign"
  }
];


const unit6 = [
  {
    q: "Left Riemann sum: when is it an overestimate or underestimate?",
    a: "Overestimate if \\(f\\) is decreasing; underestimate if \\(f\\) is increasing"
  },
  {
    q: "Right Riemann sum: when is it an overestimate or underestimate?",
    a: "Overestimate if \\(f\\) is increasing; underestimate if \\(f\\) is decreasing"
  },
  {
    q: "Trapezoidal sum: when is it an overestimate or underestimate?",
    a: "Overestimate if \\(f\\) is concave up; underestimate if \\(f\\) is concave down"
  },
  {
    q: "Fundamental Theorem of Calculus (Part 1)",
    a: "\\(\\frac{d}{dx}\\left[\\int_a^x f(t)\\,dt\\right]=f(x)\\)"
  },
  {
    q: "If \\(g(x)=\\int_a^x f(t)\\,dt\\), find \\(g'(x)\\) and \\(g''(x)\\)",
    a: "\\(g'(x)=f(x)\\) and \\(g''(x)=f'(x)\\)"
  },
  {
    q: "Fundamental Theorem of Calculus (Part 2)",
    a: "\\(\\int_a^b f'(x)\\,dx=f(b)-f(a)\\)"
  },
  {
    q: "Initial Value Problem (FTC form)",
    a: "\\(f(b)=f(a)+\\int_a^b f'(x)\\,dx\\)"
  },
  {
    q: "Power Rule for integrals",
    a: "\\(\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+C\\)"
  },
  {
    q: "Integral of \\(\\frac{1}{x}\\)",
    a: "\\(\\int \\frac{1}{x}\\,dx=\\ln|x|+C\\)"
  },
  {
    q: "Integral of \\(e^x\\)",
    a: "\\(\\int e^x\\,dx=e^x+C\\)"
  },
  {
    q: "Integral of \\(\\cos x\\)",
    a: "\\(\\int \\cos x\\,dx=\\sin x+C\\)"
  },
  {
    q: "Integral of \\(\\sin x\\)",
    a: "\\(\\int \\sin x\\,dx=-\\cos x+C\\)"
  }
];


/* ---------- UTILITIES ---------- */

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateQuiz() {
  const quiz = document.getElementById("quiz");
  quiz.classList.remove("show-answers");
  quiz.innerHTML = "";

  const selections = [
    { ...randomFrom(unit0), cls: "unit0", label: "Unit 0" },
    { ...randomFrom(unit1to3), cls: "unit1", label: "Units 1–3" },
    { ...randomFrom(unit4), cls: "unit4", label: "Unit 4" },
    { ...randomFrom(unit5), cls: "unit5", label: "Unit 5" },
    { ...randomFrom(unit6), cls: "unit6", label: "Unit 6" }
  ];

  selections.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
      <div class="card ${item.cls}">
        <strong>Problem ${i + 1} (${item.label})</strong><br><br>
        ${item.q}
      </div>
      <div class="card answer">
        <strong>Answer</strong><br><br>
        ${item.a}
      </div>
    `;

    quiz.appendChild(row);
  });

  MathJax.typeset();
}

function toggleAnswers() {
  document.getElementById("quiz").classList.toggle("show-answers");
}


</script>

</body>
</html>
